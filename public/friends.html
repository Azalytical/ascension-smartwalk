<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F4F3EF">
  <meta name="description" content="Aidem: друзья на карте, встречи посередине и события в Астане. Местом делитесь только вы и только на выбранное время.">
  <title>Aidem · друзья</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E1621'/%3E%3Cpath d='M37.6 16.7A16 16 0 1 0 48 30' fill='none' stroke='%23F5B700' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='43.5' cy='20.5' r='3.6' fill='%234AA8FF'/%3E%3C/svg%3E" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin=""></script>
  <style>
    :root { --ink: #0E1621; --gold: #F5B700; --sky: #1A8CFF; --bg: #F4F3EF; --surface: #FFFFFF; --green: #0F9F4F; --amber: #B86E00; --red: #D93036;
      --font: "Onest", "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --ink: #F2F4F7; --gold: #FFC21A; --sky: #4AA8FF; --bg: #0A0F15; --surface: #121922; --green: #3DD68C; --amber: #F2A93B; --red: #FF6B6B; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }
    #map { position: fixed; inset: 0; }
    .fr-top { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; pointer-events: none; z-index: 5; }
    .fr-top a { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--surface); color: var(--ink);
      text-decoration: none; font-weight: 650; box-shadow: 0 4px 16px rgba(14, 22, 33, .16); }
    .fr-top svg { width: 22px; height: 22px; }
    .fr-top .lang-switch { pointer-events: auto; display: inline-flex; gap: 2px; padding: 3px; margin-left: auto; border-radius: 999px; background: var(--surface); box-shadow: 0 4px 16px rgba(14, 22, 33, .16); }
    .fr-top .lang-opt { min-width: 44px; height: 38px; padding: 0 9px; border: 0; border-radius: 999px; background: none; color: inherit; font: 700 13px var(--font); letter-spacing: .02em; opacity: .75; cursor: pointer; }
    .fr-top .lang-opt[aria-pressed="true"] { background: var(--ink); color: var(--bg); opacity: 1; }
    #sheet { position: fixed; left: 0; right: 0; bottom: 0; height: var(--sheet-height, 62dvh); overflow: auto; overscroll-behavior: contain; background: var(--surface);
      border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(14, 22, 33, .18); padding: 0 16px max(16px, env(safe-area-inset-bottom)); box-sizing: border-box; z-index: 4;
      transition: height 260ms cubic-bezier(.2, .8, .2, 1); }
    .fr-handle { position: sticky; top: 0; display: flex; justify-content: center; width: calc(100% + 32px); margin: 0 -16px 4px; height: 28px; border: 0; background: var(--surface); cursor: pointer; z-index: 2; }
    .fr-handle::before { content: ""; width: 44px; height: 5px; margin-top: 10px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 22%, transparent); }
    @media (min-width: 900px) {
      #sheet { top: 12px; left: 12px; bottom: 12px; right: auto; width: 420px; height: auto; border-radius: 22px; padding-bottom: 16px; }
      .fr-handle { display: none; }
      .fr-top { left: 444px; }
    }
    @media (prefers-reduced-motion: reduce) { #sheet { transition: none; } }
    .fr-fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: color-mix(in srgb, var(--ink) 70%, transparent); }
  </style>
</head>
<body>
  <div id="map" aria-label="Карта друзей, встреч и событий"></div>
  <div class="fr-top"><a href="/" aria-label="Вернуться к прогулкам Aidem"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M37.6 16.7A16 16 0 1 0 48 30" fill="none" stroke="#F5B700" stroke-width="6" stroke-linecap="round"/><circle cx="43.5" cy="20.5" r="3.6" fill="#4AA8FF"/></svg>Aidem</a></div>
  <section id="sheet" aria-label="Друзья, встречи и события"><button class="fr-handle" type="button" aria-label="Развернуть или свернуть панель"></button><div id="sheet-body"></div></section>
  <script type="module">
    import { mountSocial } from '/js/social/screens.js';
    import * as social from '/js/social/service.js';
    import { t, addStrings } from '/js/core/i18n.js';
    import { on } from '/js/core/store.js';
    import { langSwitch } from '/js/ui/lang-switch.js';

    // The page's own labels; the language is the one chosen in Aidem on this device, and the switch at the top changes it here too.
    addStrings({
      ru: { 'fr.title': 'Aidem · друзья', 'fr.back': 'Вернуться к прогулкам Aidem', 'fr.map': 'Карта друзей, встреч и событий', 'fr.sheet': 'Друзья, встречи и события',
        'fr.handle': 'Развернуть или свернуть панель', 'fr.noMap': 'Карта не загрузилась. Друзья, встречи и события работают и без неё.', 'fr.place': 'Место встречи' },
      kk: { 'fr.title': 'Aidem · достар', 'fr.back': 'Aidem серуендеріне оралу', 'fr.map': 'Достар, кездесулер мен іс-шаралар картасы', 'fr.sheet': 'Достар, кездесулер мен іс-шаралар',
        'fr.handle': 'Панельді жаю не жию', 'fr.noMap': 'Карта жүктелмеді. Достар, кездесулер мен іс-шаралар онсыз да жұмыс істейді.', 'fr.place': 'Кездесу орны' },
      en: { 'fr.title': 'Aidem · friends', 'fr.back': 'Back to Aidem walks', 'fr.map': 'Map of friends, meetups and events', 'fr.sheet': 'Friends, meetups and events',
        'fr.handle': 'Expand or collapse the panel', 'fr.noMap': 'The map did not load. Friends, meetups and events still work without it.', 'fr.place': 'Meeting place' },
    });
    function label() {
      document.title = t('fr.title');
      document.getElementById('map').setAttribute('aria-label', t('fr.map'));
      document.querySelector('.fr-top a').setAttribute('aria-label', t('fr.back'));
      document.getElementById('sheet').setAttribute('aria-label', t('fr.sheet'));
      document.querySelector('.fr-handle').setAttribute('aria-label', t('fr.handle'));
      const note = document.querySelector('.fr-fallback');
      if (note) note.textContent = t('fr.noMap');
    }
    document.querySelector('.fr-top').append(langSwitch());

    const sheet = document.getElementById('sheet');
    const heights = { peek: 0.3, half: 0.62, full: 0.9 };
    let sheetState = 'half';
    let map = null;
    const desktop = () => matchMedia('(min-width: 900px)').matches;

    function pad() {
      if (!map) return;
      if (desktop()) map.setPadding({ left: 444, top: 24, bottom: 24, right: 24 });
      else map.setPadding({ top: 72, bottom: Math.round(innerHeight * heights[sheetState]), left: 24, right: 24 });
    }
    function openSheet(state) {
      sheetState = heights[state] ? state : 'half';
      sheet.style.setProperty('--sheet-height', `${Math.round(heights[sheetState] * 100)}dvh`);
      pad();
    }
    sheet.querySelector('.fr-handle').addEventListener('click', () => openSheet(sheetState === 'peek' ? 'half' : sheetState === 'half' ? 'full' : 'peek'));
    addEventListener('resize', pad);

    if (window.maplibregl) {
      map = new maplibregl.Map({
        container: 'map', center: [71.43, 51.128], zoom: 12.5, attributionControl: { compact: true },
        style: { version: 8, sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, maxzoom: 19,
          attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' } },
          layers: [{ id: 'osm', type: 'raster', source: 'osm' }] }
      });
      pad();
    } else {
      document.getElementById('map').append(Object.assign(document.createElement('p'), { className: 'fr-fallback', textContent: t('fr.noMap') }));
    }

    social.start();
    const screen = mountSocial(document.getElementById('sheet-body'), { map, maplibregl: window.maplibregl, openSheet });
    label();
    on('lang', () => { label(); screen.relang(); });

    const params = new URLSearchParams(location.search);
    const invite = params.get('friend'), eventId = params.get('event'), meetupId = params.get('meetup');
    const place = params.get('lat') && params.get('lon') ? { id: params.get('place'), name: params.get('name') || t('fr.place'), lat: Number(params.get('lat')), lon: Number(params.get('lon')) } : null;
    if (invite || eventId || meetupId || place) history.replaceState(null, '', location.pathname);
    if (invite) screen.openInvite(invite);
    if (eventId) screen.openEvent(eventId);
    if (meetupId) social.refresh().then(() => screen.openMeetup(meetupId));
    if (place && Number.isFinite(place.lat) && Number.isFinite(place.lon)) social.refresh().then(() => screen.planMeetup(place));
  </script>
</body>
</html>
