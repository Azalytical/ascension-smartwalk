<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F4F3EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)">
  <title>Seruen: прогулка по Астане ровно на ваше время</title>
  <meta name="description" content="Seruen подбирает место в Астане под ваше свободное время: считает дорогу туда, время на месте и обратный путь, а ИИ объясняет выбор. Данные OpenStreetMap, совет Gemini.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Seruen: прогулка по Астане ровно на ваше время">
  <meta property="og:description" content="ИИ подберёт место рядом и вернёт вас вовремя.">
  <meta property="og:image" content="/assets/brand/seruen/og-1200x630.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/brand/seruen/mark.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/brand/seruen/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/brand/seruen/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Seruen">
  <link rel="preload" href="/vendor/fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="modulepreload" href="/js/main.js">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div class="app" id="app">
    <div id="map" class="map" role="region" aria-label="Карта Астаны"></div>
    <div class="map-crosshair" aria-hidden="true"><span></span></div>
    <p id="map-note" class="map-note" role="status" hidden></p>

    <header class="topbar" aria-label="Seruen">
      <a class="brand" href="/" aria-label="Seruen">
        <img src="/assets/brand/seruen/mark.svg" alt="" width="32" height="32">
        <span class="wordmark">seruen</span>
      </a>
    </header>

    <div class="map-fabs" role="group" aria-label="Карта">
      <button id="fab-zoom-in" class="fab fab-desktop" type="button" aria-label="Приблизить"><svg class="icon" aria-hidden="true"><use href="/assets/icons/seruen.svg#plus"/></svg></button>
      <button id="fab-zoom-out" class="fab fab-desktop" type="button" aria-label="Отдалить"><svg class="icon" aria-hidden="true"><use href="/assets/icons/seruen.svg#minus"/></svg></button>
      <button id="fab-tilt" class="fab" type="button" aria-pressed="false" aria-label="Наклонить карту"><span class="fab-text">3D</span></button>
      <button id="fab-locate" class="fab" type="button" aria-label="Показать, где я"><svg class="icon" aria-hidden="true"><use href="/assets/icons/seruen.svg#locate"/></svg></button>
    </div>

    <section id="sheet" class="sheet" aria-label="Seruen">
      <button id="sheet-handle" class="sheet-handle" type="button" aria-expanded="false" aria-label="Развернуть панель"><span></span></button>
      <div class="sheet-brand">
        <a class="brand" href="/" aria-label="Seruen">
          <img src="/assets/brand/seruen/mark.svg" alt="" width="30" height="30">
          <span class="wordmark">seruen</span>
        </a>
        <span class="brand-city">Астана</span>
      </div>
      <div id="sheet-body" class="sheet-body" role="tabpanel"></div>
    </section>

    <button id="live-pill" class="live-pill" type="button" hidden></button>
    <nav id="tabbar" class="tabbar" role="tablist" aria-label="Разделы"></nav>
  </div>
  <div id="toasts" class="toasts"></div>
  <div id="announcer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <noscript><p class="noscript">Seruen работает в браузере с включённым JavaScript.</p></noscript>
</body>
</html>
